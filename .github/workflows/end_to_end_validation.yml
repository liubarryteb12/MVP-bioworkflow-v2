# P1-P4 端到端验证 · 云端执行入口（第二版）
#
# 触发方式：
#   1) 推送/更新 .github/triggers/<DATASET>.flag 文件（推荐；workflow 位于第二版分支，
#      故 push 触发器分支过滤须设为 第二版）
#   2) workflow_dispatch 不可用：GitHub 的 workflow_dispatch 只认默认分支上的 workflow，
#      而默认分支为第一版 main，第二版 workflow 不在默认分支上。
#
# 背景：为不改动默认分支、不污染第一版，第二版一律用 push-paths + flag 文件触发。
#       当前第二版数据集 = GSE174263（Drosophila 卵巢 RNA-seq，GPL21306），注释库用 org.Dm.eg.db。
#
# 纪律：完全按对应论文的分析思路走，不做自定义；失败如实报告，不掩盖。
# 已知环境约束：clusterProfiler 在云端安装失败（依赖 treeio），通路富集改用
#               org.Hs.eg.db + 超几何检验 + BH，已在模块 handoff 声明。

name: P1-P4 End-to-End Validation (v2)

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'GEO dataset ID (e.g., GSE7451)'
        required: true
      dataset_stage:
        description: 'basic / advanced'
        required: false
        default: 'basic'
      run_mutation:
        description: 'Run guard mutation self-test'
        required: false
        default: 'true'
  push:
    branches: [第二版]
    paths:
      - '.github/triggers/*.flag'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # preprocessCore（affy::rma）在受限容器里多线程会报 pthread_create() is 22
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve dataset from trigger
        id: trig
        run: |
          set -e
          if [ -n "${{ inputs.dataset_id }}" ]; then
            echo "dataset=${{ inputs.dataset_id }}" >> "$GITHUB_OUTPUT"
            echo "stage=${{ inputs.dataset_stage }}" >> "$GITHUB_OUTPUT"
          else
            f=$(ls -t .github/triggers/*.flag 2>/dev/null | head -1)
            if [ -z "$f" ]; then echo "no trigger flag found"; exit 1; fi
            d=$(basename "$f" .flag)
            echo "dataset=$d" >> "$GITHUB_OUTPUT"
            echo "stage=$(sed -n 's/^stage: *//p' "$f" | head -1 || echo basic)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set env
        run: |
          echo "DATASET_ID=${{ steps.trig.outputs.dataset }}" >> "$GITHUB_ENV"
          echo "DATASET_STAGE=${{ steps.trig.outputs.stage || 'basic' }}" >> "$GITHUB_ENV"
          echo "RUN_MUTATION=${{ inputs.run_mutation || 'true' }}" >> "$GITHUB_ENV"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
          use-public-rspm: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          # fonts-liberation：Arial 的度量兼容替代（Linux 无真 Arial）；
          # fontconfig 的 fc-list 供 R 出图时探测可用字体，保证图内字体统一且可嵌入。
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libjpeg-dev poppler-utils fontconfig fonts-liberation
          # libreoffice-writer：A 路 docx → pdf；texlive-xetex：B 路 .tex → pdf
          # （P3 §2.4 要求 A/B 双路各自产稿与 PDF，不因另一路存在而免检）
          sudo apt-get install -y --no-install-recommends libreoffice-writer texlive-xetex texlive-latex-recommended
          fc-list : family | sort -u | head -20
          which soffice || which libreoffice || echo "WARN: LibreOffice 不可用，pdf 将缺失"

      - name: Install CRAN base
        run: |
          Rscript -e 'install.packages(c("BiocManager", "jsonlite", "yaml"), Ncpus = 4)'

      - name: Install Bioconductor packages (one by one, never abort)
        run: |
          for p in GEOquery limma affy DESeq2 org.Hs.eg.db org.Mm.eg.db org.Dm.eg.db GO.db hgu133plus2.db hgu95av2.db illuminaHumanv4.db matrixStats gplots; do
            echo "=== installing $p ==="
            Rscript -e "BiocManager::install('$p', ask = FALSE, update = FALSE, Ncpus = 4)" 2>&1 | tail -3 || echo "FAILED: $p"
          done
          Rscript -e 'for (p in c("limma","affy","org.Hs.eg.db","org.Dm.eg.db","GO.db","hgu133plus2.db","illuminaHumanv4.db")) cat(p, requireNamespace(p, quietly=TRUE), "\n")'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          mkdir -p logs
          Rscript -e 'sessionInfo()' > logs/session_r.txt
          python -c "import sys; print(sys.version)" > logs/session_python.txt
          pip freeze > logs/requirements_frozen.txt

      # 云端 runner 有公网直连能力，不要走本地代理（--no-proxy）
      # 大数据集（RAW.tar >300MB）自动降载为 series matrix 表达矩阵
      - name: Download dataset
        run: |
          # --with-series-matrix：非 Affymetrix 芯片（Illumina / Agilent）不提供 CEL，
          # series matrix 是唯一可用的表达矩阵入口，必须一并取回。
          python scripts/download_geo.py --dataset "$DATASET_ID" --output inputs/raw/ --no-proxy --smart-size --with-series-matrix

      - name: Data availability analysis
        run: |
          python scripts/data_availability.py --dataset "$DATASET_ID" --workspace . --no-proxy

      # 探针 → ENTREZ 映射：Bioconductor 芯片库（illuminaHumanv4.db 等）在云端可能装得上
      # 却映射不出条目，此时用 GEO 官方平台注释表兜底，否则通路富集无从谈起。
      - name: Fetch platform annotation (probe -> ENTREZ)
        run: |
          python scripts/fetch_platform_annot.py --dataset "$DATASET_ID" --workspace . --no-proxy || true

      # preprocessCore（affy::rma）在受限容器里 pthread_create 报 EINVAL(22)：
      # 栈限制过小 + 多线程同时创建。先放宽栈限制，再退到单线程。
      - name: Run P1 analysis
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65536 2>/dev/null || echo "cannot raise stack limit"
          echo "stack limit: $(ulimit -s)"
          echo "cpus: $(nproc)"
          free -h || true
          cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true
          # preprocessCore 按可用 CPU 数创建 pthread，在 runner 上会 EINVAL。
          # 绑定到单个 CPU，让它检测到的核数为 1，避免创建额外线程。
          if command -v taskset >/dev/null 2>&1; then
            echo "pinned to CPU 0"
            taskset -c 0 python scripts/run_p1.py --workspace . --dataset "$DATASET_ID"
          else
            python scripts/run_p1.py --workspace . --dataset "$DATASET_ID"
          fi

      # P1 → P2 → P3 → P4-b 是连着的：P1 一成功就往下接，不允许只停在 P1。
      # run_p2p3p4.py 读 P1 的 analysis/_index 产出与 P4-a 题材包（04_journal/packages/<DATASET>.yaml）。
      - name: Run P2 → P3 → P4-b (chained after P1)
        if: success()
        run: |
          python scripts/run_p2p3p4.py .

      - name: Guard self-test (P4 checks)
        if: env.RUN_MUTATION == 'true'
        run: |
          python scripts/guard_selftest.py --part P4 --check || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ steps.trig.outputs.dataset }}
          path: |
            inputs/
            analysis/
            02_writing/
            03_typesetting/
            04_journal/
            logs/
          if-no-files-found: warn
