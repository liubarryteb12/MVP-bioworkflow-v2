# P1-P4 端到端验证 · 云端执行入口（第二版）
# 触发方式（本地 agent）：
#   gh workflow run end_to_end_validation.yml --ref v2-end-to-end \
#     -f dataset_id=GSE7451 -f dataset_stage=basic -f paper_pipeline='...'
#
# 纪律：完全按对应论文的分析思路走，不做自定义分析；失败如实报告，不掩盖。

name: P1-P4 End-to-End Validation (v2)

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'GEO dataset ID (e.g., GSE7451)'
        required: true
      dataset_stage:
        description: 'basic / advanced'
        required: true
        default: 'basic'
      paper_pipeline:
        description: 'Analysis pipeline from paper (JSON string)'
        required: false
        default: '{}'
      run_mutation:
        description: 'Run guard mutation self-test'
        required: false
        default: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATASET_ID: ${{ inputs.dataset_id }}
      DATASET_STAGE: ${{ inputs.dataset_stage }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
          use-public-rspm: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libjpeg-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.3.1-p1-v1

      - name: Install R packages
        run: |
          options(Ncpus = 4)
          install.packages(c("BiocManager", "jsonlite", "yaml", "data.table"), Ncpus = 4)
          BiocManager::install(c("GEOquery", "limma", "affy", "clusterProfiler", "org.Hs.eg.db"), ask = FALSE, update = FALSE, Ncpus = 4)
        shell: Rscript {0}
        env:
          R_LIBS_USER: ${{ env.R_LIBS_USER }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          Rscript -e 'sessionInfo()' > logs/session_r.txt
          python -c "import sys; print(sys.version)" > logs/session_python.txt
          pip freeze > logs/requirements_frozen.txt

      - name: Download dataset
        run: |
          python scripts/download_geo.py \
            --dataset "${{ inputs.dataset_id }}" \
            --output inputs/raw/

      - name: Data availability analysis
        run: |
          python scripts/data_availability.py \
            --dataset "${{ inputs.dataset_id }}" \
            --workspace .

      - name: Run P1 analysis
        run: |
          python scripts/run_p1.py \
            --workspace . \
            --dataset "${{ inputs.dataset_id }}" \
            --pipeline '${{ inputs.paper_pipeline }}'

      - name: Run guard mutation self-test
        if: inputs.run_mutation == 'true'
        run: |
          python scripts/guard_selftest.py --workspace .

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.dataset_id }}
          path: |
            inputs/migration_log.yaml
            analysis/
            02_writing/
            03_typesetting/
            04_journal/
            logs/
          if-no-files-found: warn
