# 云端环境探测：确认 R / Bioconductor 依赖可安装（阶段 2 前置风险验证）
#
# 触发方式：本文件本身发生变更并推送到 v2-end-to-end 分支时自动运行。
# 说明：GitHub 的 workflow_dispatch 只认默认分支上的 workflow 文件，本仓库默认分支为
#       第一版的 main。为不改动默认分支、不污染第一版，第二版一律用 push-paths 触发。

name: Env Probe (R/Bioconductor)

on:
  workflow_dispatch:
  push:
    branches: [v2-end-to-end]
    paths:
      - '.github/workflows/env_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libjpeg-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("BiocManager", "jsonlite", "yaml"), Ncpus = 4)'
          Rscript -e 'BiocManager::install(c("GEOquery", "limma", "affy", "clusterProfiler", "org.Hs.eg.db"), ask = FALSE, update = FALSE, Ncpus = 4)'

      - name: Verify packages
        run: |
          Rscript -e 'for (p in c("limma","affy","clusterProfiler","org.Hs.eg.db","GEOquery")) cat(p, as.character(packageVersion(p)), "\n")'
          Rscript -e 'sessionInfo()'
