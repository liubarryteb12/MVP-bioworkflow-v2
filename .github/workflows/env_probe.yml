# 云端环境探测：逐包安装并报告可用性（阶段 2 前置风险验证）
#
# 触发：本文件变更并推送到 v2-end-to-end 分支时自动运行。
# 背景：GitHub 的 workflow_dispatch 只认默认分支上的 workflow 文件，本仓库默认分支为第一版 main。
#       为不改动默认分支、不污染第一版，第二版一律用 push-paths 触发。
#
# 已探测结论（2026-09-15 第一轮）：
#   - limma / affy / GEOquery：可安装
#   - clusterProfiler：**安装失败**（依赖 treeio 加载异常，BiocManager 静默跳过但退出码为 0）
#   → 通路富集改由 org.Hs.eg.db + AnnotationDbi 手工超几何检验实现（等价方法，见模块 handoff 声明）

name: Env Probe (R/Bioconductor)

on:
  workflow_dispatch:
  push:
    branches: [v2-end-to-end]
    paths:
      - '.github/workflows/env_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev libjpeg-dev poppler-utils

      - name: Install CRAN base
        run: |
          Rscript -e 'install.packages(c("BiocManager", "jsonlite", "yaml"), Ncpus = 4)'

      - name: Install Bioconductor packages one by one
        run: |
          for p in GEOquery limma affy org.Hs.eg.db GO.db hgu133plus2.db hgu95av2.db clusterProfiler; do
            echo "=== installing $p ==="
            Rscript -e "BiocManager::install('$p', ask = FALSE, update = FALSE, Ncpus = 4)" 2>&1 | tail -5 || echo "FAILED: $p"
          done

      - name: Verify each package (never fails the job)
        run: |
          Rscript -e '
            pkgs <- c("limma","affy","GEOquery","org.Hs.eg.db","GO.db","hgu133plus2.db","hgu95av2.db","clusterProfiler","AnnotationDbi")
            for (p in pkgs) {
              ok <- requireNamespace(p, quietly = TRUE)
              ver <- if (ok) as.character(packageVersion(p)) else "-"
              cat(sprintf("%-18s %-6s %s\n", p, if (ok) "OK" else "MISSING", ver))
            }
          '
          echo "--- pdftocairo ---"
          pdftocairo -v 2>&1 | head -2

      - name: Check KEGG/GO mapping availability
        run: |
          Rscript -e '
            if (requireNamespace("org.Hs.eg.db", quietly = TRUE)) {
              library(AnnotationDbi)
              k <- head(keys(org.Hs.eg.db, keytype = "ENTREZID"), 3)
              cat("sample ENTREZ keys:", paste(k, collapse = ","), "\n")
              cat("GO2ALLORGS n:", length(ls(org.Hs.eg.db::org.Hs.egGO2ALLEGS)), "\n")
            } else {
              cat("org.Hs.eg.db MISSING\n")
            }
          '
