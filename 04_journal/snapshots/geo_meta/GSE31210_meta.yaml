accession: GSE31210
title: Gene expression data for pathological stage I-II lung adenocarcinomas
summary:
- Identification of genes up-regulated in ALK-positive and EGFR/KRAS/ALK-negative
  lung adenocarcinomas.
- 'To elucidate molecular characteristics of lung adenocarcinomas (ADCs) with ALK
  mutations and those without EGFR, KRAS and ALK mutations, 226 primary lung ADCs
  of pathological stage I-II, examined for the status of EGFR, KRAS and ALK mutations,
  were subjected to genome-wide expression profiling, and genes up-regulated in lung
  ADCs with ALK mutations and those without EGFR, KRAS and ALK mutations were identified.  One
  hundred and seventy-four genes, including ALK, were selected as being up-regulated
  specifically in 79 lung ADCs without EGFR and KRAS mutations.  These 79 cases were
  divided into:  11 cases of ALK-positive ADCs, 36 cases of group A triple-negative
  ADCs, and 32 cases of group B triple-negative ADCs, by unsupervised clustering according
  to the expression of the 174 genes.  In ALK-positive ADCs, 30 genes, including ALK
  itself and GRIN2A, were significantly overexpressed.  Group A triple-negative ADC
  cases showed significantly worse prognoses for relapse and death than ADC cases
  with EGFR, KRAS or ALK mutations and group B triple-negative ADC cases.  Nine genes
  were identified as being significantly up-regulated in group A triple-negative ADC
  cases and critical for predicting their prognosis.  The nine genes included DEPDC1,
  which had been identified as a candidate diagnostic and therapeutic target in bladder
  and breast cancers.  Genes discriminating this group of ADCs will be useful for
  selection of patients who will benefit from adjuvant chemotherapy after surgical
  resection of stage I-II triple-negative ADCs and also informative for the development
  of molecular targeting therapies for these patients.'
overall_design:
- Expression profiles in of 226 lung adenocarcinomas (127 with EGFR mutation, 20 with
  KRAS mutation, 11 with EML4-ALK fusion and 68 triple negative cases).
