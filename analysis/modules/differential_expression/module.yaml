module_id: differential_expression
name: 差异表达分析（limma + BH）
category: differential_expression
language: R
version: 1.0.0
status: available
registered_at: 2026-09-15T16:00:00+08:00
registered_by: agent

description: >
  按 Hu S, et al. 2007 / Ginos MA, et al. 2004 的思路：limma 做两组间比较，BH 校正 FDR。
  注意：本模块只负责计算；样本量是否足以支撑统计推断由 P1 质控（T21）在调用前判定。

papers:
  - Hu S, et al. Arthritis Rheum. 2007.
  - Ginos MA, et al. Cancer Res. 2004.

inputs:
  - name: expr_filtered
    format: csv
    required: true
  - name: sample_sheet
    format: csv
    required: true

outputs:
  - name: deg_table
    format: csv
    is_final: true
  - name: volcano
    format: pdf
    is_final: true
  - name: de_summary
    format: csv
    is_final: true

parameters:
  - name: padj_threshold
    type: float
    default: 0.05
  - name: log2fc_threshold
    type: float
    default: 1.0
  - name: adjust_method
    type: string
    default: BH

steps:
  - step: 1
    description: 表达矩阵与样本表对齐
    tool: R
  - step: 2
    description: limma 拟合 + eBayes + BH 校正
    tool: R (limma)
  - step: 3
    description: 火山图
    tool: R (base graphics)

dependencies: [preprocess]
