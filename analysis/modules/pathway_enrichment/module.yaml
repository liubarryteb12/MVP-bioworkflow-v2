module_id: pathway_enrichment
name: 通路富集（GO / KEGG，超几何 + BH）
category: enrichment
language: R
version: 1.0.0
status: available
registered_at: 2026-09-15T16:00:00+08:00
registered_by: agent

description: >
  对 limma 检出的显著差异探针做 GO / KEGG 通路富集。
  论文原文用 MAPPFinder；MAPPFinder 为商业遗留工具，云端不可安装，
  clusterProfiler 在云端安装失败（依赖 treeio 加载异常），
  因此改用 org.Hs.eg.db 注释映射 + 超几何检验 + BH 校正实现等价富集。
  该替换已在 handoff 与 Methods 中显式声明。

papers:
  - Hu S, et al. Arthritis Rheum. 2007.（原文通路富集用 MAPPFinder）

inputs:
  - name: deg_table
    format: csv
    required: true

outputs:
  - name: enrich_go
    format: csv
    is_final: true
  - name: enrich_kegg
    format: csv
    is_final: true
  - name: enrich_summary
    format: csv
    is_final: true
  - name: enrich_plot
    format: pdf
    is_final: true

parameters:
  - name: padj_threshold
    type: float
    default: 0.05
  - name: log2fc_threshold
    type: float
    default: 1.0
  - name: annotation_db
    type: string
    default: hgu133plus2.db
    description: 探针注释包；GPL570 用 hgu133plus2.db，GPL8300 用 hgu95av2.db
  - name: org_db
    type: string
    default: org.Hs.eg.db
  - name: min_term_size
    type: int
    default: 5
  - name: max_term_size
    type: int
    default: 500

steps:
  - step: 1
    description: 显著探针 → ENTREZ 映射，构建背景基因集
    tool: R (AnnotationDbi)
  - step: 2
    description: GO / KEGG 超几何检验 + BH 校正
    tool: R (stats::phyper)
  - step: 3
    description: 富集条形图
    tool: R (base graphics)

dependencies: [differential_expression]

known_limitations:
  - 方法替换为超几何检验，与 MAPPFinder 的内部实现不完全一致，方向性结论等价但具体 P 值不可直接比较
  - clusterProfiler 不可用时无 GSEA 类分析能力
