module_id: preprocess
name: 芯片预处理（RMA + 探针过滤）
category: preprocessing
language: R
version: 1.0.0
status: available
registered_at: 2026-09-15T16:00:00+08:00
registered_by: agent

description: >
  按 Hu S, et al. Arthritis Rheum. 2007 的分析思路：RMA 算法（背景校正 + 分位数标准化），
  随后剔除在 >75% 样本中判定为 absent 的探针集。

papers:
  - Hu S, et al. Salivary Proteomic and Genomic Biomarkers for Primary Sjögren's Syndrome. Arthritis Rheum. 2007.

inputs:
  - name: cel_dir
    format: directory
    required: true
    description: 解压后的 CEL 文件目录

outputs:
  - name: expr_rma
    format: csv
    is_final: false
  - name: expr_filtered
    format: csv
    is_final: true
  - name: qc_boxplot
    format: pdf
    is_final: true
  - name: qc_density
    format: pdf
    is_final: true
  - name: filtering_summary
    format: csv
    is_final: true

parameters:
  - name: absent_fraction_threshold
    type: float
    default: 0.75
    description: 探针在超过该比例样本中 absent 则剔除
  - name: random_seed
    type: int
    default: 42

steps:
  - step: 1
    description: 读取 CEL 并输出原始强度 QC 图
    tool: R (affy)
  - step: 2
    description: RMA 标准化
    tool: R (affy::rma)
  - step: 3
    description: MAS5 present/absent 判定并过滤探针
    tool: R (affy::mas5calls)

dependencies: []
