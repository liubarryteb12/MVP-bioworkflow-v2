module_id: rnaseq_de
name: RNA-seq 计数矩阵 QC + DESeq2 差异表达
category: differential_expression
language: R
version: 1.0.0
status: available
registered_at: 2026-09-15T18:20:00+08:00
registered_by: agent

description: >
  读取 RNA-seq 计数矩阵，做描述性质控（library size / 检出基因数 / 样本相关 / PCA），
  并按 run_deseq2 开关执行 DESeq2 差异表达。
  该开关由 P1 质控（T21 组别样本量下限与平衡）在调用前判定，本模块不自行决定能否做统计推断。

papers:
  - Orsi GA, et al. PMID 34982772（GSE174263：Snr1/mod(mdg4) 敲低 vs WT，DESeq2）
  - PMID 27897403（GSE61444：WT vs Jmjd6-/- 胸腺基质转录组）

inputs:
  - name: count_matrix
    format: tsv/csv
    required: true
  - name: sample_sheet
    format: csv
    required: true

outputs:
  - name: qc_summary
    format: csv
    is_final: true
  - name: qc_libsize
    format: pdf
    is_final: true
  - name: qc_correlation
    format: pdf
    is_final: true
  - name: qc_pca
    format: pdf
    is_final: true
  - name: deg_table
    format: csv
    is_final: true
  - name: volcano
    format: pdf
    is_final: true
  - name: de_summary
    format: csv
    is_final: true

parameters:
  - name: run_deseq2
    type: bool
    default: false
    description: 由 T21 质控决定；false 时只做描述性 QC
  - name: padj_threshold
    type: float
    default: 0.05
  - name: log2fc_threshold
    type: float
    default: 1.0

steps:
  - step: 1
    description: 读取计数矩阵与样本表
    tool: R
  - step: 2
    description: 描述性质控（library size / 相关 / PCA）
    tool: R
  - step: 3
    description: DESeq2 差异表达（仅 run_deseq2=true 且样本满足最低要求）
    tool: R (DESeq2)

dependencies: []
