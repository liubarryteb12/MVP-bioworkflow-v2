accession: GSE174263
title: Comparison of Drosophila melanogaster ovarian transcriptome after germline
  specific knock down of Snr1 or mod(mdg4) genes
summary:
- Transcriptomic analysis and identification of differentially expressed genes in
  control vs KD Drosophila melanogaster ovaries. We compared gene expression profiles
  in Drosophila melanogaster ovaries in which the Snr1 or the mod(mdg4) gene have
  been selectively knocked down by tissues specific shRNA expression.
overall_design:
- Drosophila melanogaster ovaries mRNA profiles of 3-day old wild type (WT), female
  germline specific Snr1 knock-down (Snr1KD) and female germline specific mod(mdg4)
  knock-down (mod(mdg4)KD) were generated by deep sequencing, in duplicate, using
  Illumina Hiseq 4000.
