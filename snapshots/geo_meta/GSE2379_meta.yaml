accession: GSE2379
title: Hypopharyngeal_cancer_transcriptome
summary:
- Gene expression analysis of a unique HNSCC (Head and Neck Squamous Cell Carcinoma)
  localization, the hypopharynx. Four normal and 34 tumor samples were analysed using
  Affymetrix HG-U95A microarrays containing probe sets representing ~12650 distinct
  transcription features.
