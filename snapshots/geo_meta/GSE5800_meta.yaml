accession: GSE5800
title: Expression data from mouse IRF6 null and wt skin
summary:
- Transcription factor paralogs may share a common role (e.g. Hox) in staged or overlapping
  expression in specific tissues.   In other examples, members have distinct roles
  in a range of embryologic, differentiation or response pathways (e.g. Tbx, Pax).
  For the Interferon Regulatory Factor (IRF) family of transcription factors, mice
  deficient in Irf1, Irf2, Irf3, Irf4, Irf5, Irf7, Irf8 or Irf9, have defects in the
  immune response but display no embryologic abnormalities. Mice deficient for Irf6
  have not been reported, but in humans, mutations in IRF6 cause two Mendelian orofacial
  clefting syndrome, and genetic variation in IRF6 confers risk for isolated cleft
  lip and palate.
- Mice deficient for Irf6 have abnormal skin, limb and craniofacial development. Histological
  and gene expression analyses indicate that the primary defect is in keratinocyte
  differentiation and proliferation.  This study describes a novel role for an IRF
  family member in epidermal development.
- 'Keywords: Comparison of tissue from two genotypes'
overall_design:
- Skin from E17.5 mice was removed and flash frozen for RNA extraction and hybridization
  on Affymetrix microarrays.
